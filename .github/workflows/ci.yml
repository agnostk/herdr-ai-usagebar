name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to catch RustSec advisories and herdr releases that land
    # without a push here.
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: shellcheck
        run: shellcheck demo/*.sh demo/fake-ai-usagebar demo/shell scripts/*.sh
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --all-targets

  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Matches `rust-version` in Cargo.toml. herdr builds the plugin with the
      # user's toolchain on install, so the minimum has to keep working.
      - run: rustup toolchain install 1.89 --profile minimal && rustup default 1.89
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --all-targets

  e2e:
    # The plugin linked into a real herdr server, oldest supported and newest
    # release, driven by scripts/e2e.sh with a fake ai-usagebar.
    name: herdr ${{ matrix.herdr }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        herdr: [v0.9.0, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install herdr ${{ matrix.herdr }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-herdr.sh "${{ matrix.herdr }}" "$RUNNER_TEMP/herdr/herdr"
      - name: end-to-end
        env:
          HERDR: ${{ runner.temp }}/herdr/herdr
        run: scripts/e2e.sh

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    outputs:
      percent: ${{ steps.summary.outputs.percent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component llvm-tools && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov
      # Includes the integration tests, which run the plugin binary (and the
      # detached refresher it spawns) as herdr would.
      - run: cargo llvm-cov --locked --all-targets --lcov --output-path lcov.info
      - run: cargo llvm-cov report --json --summary-only --output-path coverage.json
      - id: summary
        name: summary
        run: |
          percent=$(python3 -c 'import json; print(round(json.load(open("coverage.json"))["data"][0]["totals"]["lines"]["percent"], 1))')
          echo "percent=$percent" >> "$GITHUB_OUTPUT"
          {
            echo "### Line coverage: ${percent}%"
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          retention-days: 14

  coverage-badge:
    # Publishes the README badge as a shields.io endpoint file on the
    # `badges` branch, so coverage needs no third-party service or token.
    name: publish coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          PERCENT: ${{ needs.coverage.outputs.percent }}
        run: |
          color=$(python3 -c 'import os; p = float(os.environ["PERCENT"]); print(next(c for t, c in [(90, "brightgreen"), (80, "green"), (70, "yellowgreen"), (60, "yellow"), (0, "red")] if p >= t))')
          git switch --orphan badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PERCENT" "$color" > coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "coverage: ${PERCENT}%"
          # A single-commit branch that only ever holds the badge file.
          git push --force origin badges

  deny:
    name: advisories, licenses, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
